name: Publier les articles PAEB
on:
  push:
    branches: [main]
    paths:
      - 'incoming/paeb-tous-articles-site-ready.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Importer les articles et mettre à jour le sitemap
        run: python scripts/import_articles_paeb.py
      - name: Publier les pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/ actualites.html sitemap.xml
          git diff --cached --quiet || (git commit -m "Publish PAEB articles and sitemap" && git push)
