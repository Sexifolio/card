<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cartes Bénin et Cotonou — PNG HD sans clé API</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <style>
    :root{--blue:#003399;--ink:#101828;--muted:#667085;--line:#d0d5dd}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--ink);background:#f5f7fa}
    header{padding:22px 5vw;background:#fff;border-bottom:1px solid #e4e7ec}h1{font-size:clamp(21px,3vw,30px);margin:0 0 6px}p{margin:0;color:var(--muted);line-height:1.45}
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:17px}select,button{height:44px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 14px;font:inherit}button{cursor:pointer;font-weight:700}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
    main{padding:28px 5vw 50px}.grid{display:grid;grid-template-columns:repeat(2,minmax(280px,520px));gap:28px;justify-content:center}.card{background:#fff;padding:16px;border:1px solid #e4e7ec;border-radius:16px;box-shadow:0 8px 30px #1018280a}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.top h2{margin:0;font-size:18px}.top span{font-size:12px;color:var(--muted)}
    .map{width:100%;aspect-ratio:4/5;border-radius:9px;overflow:hidden;background:#eef4ff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.status{min-height:22px;margin-top:12px;font-size:13px;color:#475467}.note{font-size:12px;margin-top:14px}.blue .leaflet-tile-pane{filter:grayscale(1) sepia(1) hue-rotate(178deg) saturate(3.5) brightness(.92)}
    .leaflet-control-attribution{font-size:9px!important}.export-stage{position:fixed;left:-10000px;top:0;width:1280px;height:1600px}
    @media(max-width:780px){.grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><h1>Cartes du Bénin et de Cotonou</h1><p>Aucune clé API nécessaire — export PNG HD vertical 4:5.</p>
    <div class="toolbar"><label for="style">Style :</label><select id="style"><option value="normal">Couleurs de la carte</option><option value="blue">Monochrome bleu</option></select><button id="reset">Recentrer les cartes</button></div><div class="status" id="status">Les cartes sont prêtes.</div>
  </header>
  <main><div class="grid">
    <section class="card" data-id="benin"><div class="top"><h2>Carte du Bénin</h2><span>1280 × 1600 px</span></div><div id="benin" class="map"></div><div class="actions"><button class="export primary">Exporter en PNG HD</button><button class="center">Recentrer</button></div></section>
    <section class="card" data-id="cotonou"><div class="top"><h2>Carte de Cotonou</h2><span>1280 × 1600 px</span></div><div id="cotonou" class="map"></div><div class="actions"><button class="export primary">Exporter en PNG HD</button><button class="center">Recentrer</button></div></section>
  </div><p class="note">Données cartographiques © contributeurs OpenStreetMap. Connexion Internet nécessaire au chargement des cartes.</p></main>
  <div id="export-stage" class="export-stage"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet-image@0.4.0/leaflet-image.js"></script>
  <script>
    const configs={benin:{center:[9.32,2.31],zoom:7,file:'carte-benin-HD.png'},cotonou:{center:[6.37,2.43],zoom:12,file:'carte-cotonou-HD.png'}};
    const maps={};
    // Même filtre que celui appliqué à l'aperçu via .blue .leaflet-tile-pane
    const BLUE_FILTER='grayscale(1) sepia(1) hue-rotate(178deg) saturate(3.5) brightness(.92)';
    function tile(){return L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,crossOrigin:true,attribution:'© OpenStreetMap'});}
    Object.entries(configs).forEach(([id,c])=>{maps[id]=L.map(id,{zoomControl:true,attributionControl:true}).setView(c.center,c.zoom);tile().addTo(maps[id]);});
    const style=document.querySelector('#style'),status=document.querySelector('#status');
    function applyStyle(){document.body.classList.toggle('blue',style.value==='blue');status.textContent=style.value==='blue'?'Mode monochrome bleu activé.':'Couleurs originales activées.'}style.onchange=applyStyle;
    function center(id){const c=configs[id];maps[id].setView(c.center,c.zoom)}
    document.querySelector('#reset').onclick=()=>Object.keys(maps).forEach(center);
    // Applique le filtre CSS (identique à l'aperçu) directement sur le canvas exporté
    function applyFilterToCanvas(canvas,filter){
      const out=document.createElement('canvas');out.width=canvas.width;out.height=canvas.height;
      const ctx=out.getContext('2d');ctx.filter=filter;ctx.drawImage(canvas,0,0);return out;
    }
    function exportMap(id){
      status.textContent='Préparation du PNG HD…';const c=configs[id],stage=document.querySelector('#export-stage');stage.innerHTML='';
      const temp=L.map(stage,{zoomControl:false,attributionControl:true,fadeAnimation:false,zoomAnimation:false}).setView(maps[id].getCenter(),maps[id].getZoom());
      const layer=tile().addTo(temp);temp.invalidateSize();let done=false;
      const render=()=>{if(done)return;done=true;setTimeout(()=>leafletImage(temp,(err,canvas)=>{if(err){status.textContent="L’export a échoué. Recharge la page puis réessaie.";temp.remove();return}
        const finalCanvas=style.value==='blue'?applyFilterToCanvas(canvas,BLUE_FILTER):canvas;
        const a=document.createElement('a');a.download=c.file;a.href=finalCanvas.toDataURL('image/png');a.click();temp.remove();stage.innerHTML='';status.textContent='PNG HD exporté : 1280 × 1600 px.';}),250)};
      layer.once('load',render);setTimeout(render,3500);
    }
    document.querySelectorAll('.card').forEach(card=>{const id=card.dataset.id;card.querySelector('.center').onclick=()=>center(id);card.querySelector('.export').onclick=()=>exportMap(id)});
    window.addEventListener('load',()=>setTimeout(()=>Object.values(maps).forEach(m=>m.invalidateSize()),100));
  </script>
</body></html>
